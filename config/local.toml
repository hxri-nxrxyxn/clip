# Clip configuration.
# Edit in the Settings page or directly in this file.
# CLI flags override these values.

[targeted]
pre = 25.0
post = 10.0
merge_gap = 5.0
limit = 0
use_llm = true
quiet_rel_db = -6.0
snap_max_shift = 5.0
music_threshold = 0.5

[llm]
base_url = "http://127.0.0.1:54301"
model = "unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
timeout = 120.0
disable_thinking = true
max_tokens = 600
min_clip = 5.0
max_clip = 60.0
heuristic_radius = 10.0
api_key = ""
api_key_file = ""
api_key_container = "unsloth"

[qwen_server]
container = "unsloth"
binary = "/opt/unsloth/llama.cpp/llama-server"
host = "0.0.0.0"
port = 54301
startup_timeout = 300.0
model = "/workspace/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-MTP-GGUF/snapshots/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf"
mmproj = "/workspace/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-MTP-GGUF/snapshots/5bc3e238d916f48a861bac2f8a1990a0e9b7e98d/mmproj-F16.gguf"
api_key_file = ""
extra_args = ["--parallel", "4", "--flash-attn", "on", "--no-context-shift", "-c", "8192", "--ubatch-size", "2048", "--video-fps", "1", "--video-timestamp-interval", "2000", "--video-ffmpeg-dir", "/usr/bin", "--fit", "on", "--metrics", "--slot-save-path", "/opt/unsloth-studio/cache/llama-slots", "--kv-unified", "--jinja", "--verbosity", "4", "--spec-type", "none", "--reasoning", "on", "--ctx-checkpoints", "6", "--load-mode", "none", "--mmproj-offload"]

[vlm]
enabled = true
frames_per_clip = 6
tile_columns = 3
tile_width = 480
max_clips = 6
timeout = 180.0
max_tokens = 700

[whisper]
model = "large-v3-turbo"
revision = "0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf"
log_prob_threshold = -0.4
seed = 1234
local_files_only = false

[yamnet]
sample_rate = 16000
window = 16000
hop = 8000
yamnet_samples = 15600
tag_membership = 0.2
peak_floor = 0.35
loud_db = 6.0
music_threshold = 0.5
music_index = 132
trigger_groups = ["LAUGHTER", "SCREAMING", "SHOUTING"]
model = "2-transcribe/services/yamnet/yamnet.tflite"
class_map = "2-transcribe/services/yamnet/yamnet_class_map.csv"

[merge_tags]
membership = 0.2
peak_floor = 0.35
abs_high = 0.6
abs_med = 0.45
abs_low = 0.35
max_bridge = 7.0
chunk_seconds = 600.0
percentile_min_spans = 8
loud_gap = 3.0
music_threshold = 0.5
music_gap = 1.5
pause = 0.7
max_words = 10
max_line_seconds = 5.0
min_cue_seconds = 0.5
max_cue_seconds = 7.0
tag_attach_lead = 0.5
vtt_wrap_columns = 42
max_repeat = 2
dup_window = 6.0
dup_ratio = 0.85
low_conf_p = 0.15
high_conf_p = 0.5
isolation_window = 1.0
min_word_dur = 0.08
max_word_dur = 2.0

[outro]
tail_seconds = 2.0
confidence_threshold = 0.05
