[project]
name = "clip2"
version = "0.1.0"
description = "Stage-based audio transcription, tagging, and clip selection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "ai-edge-litert>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "B905"]


[tool.ruff.lint.isort]
known-first-party = ["app", "views"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/streamlit_app.py",
]
